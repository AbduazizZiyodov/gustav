name: CI

on:
  push:
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "build.sh"
      - ".clang-*"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "build.sh"
      - ".clang-*"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install LLVM/Clang 19
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm19.list
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            clang-19 clang-tidy-19 clang-format-19 lld-19 ninja-build libclang-rt-19-dev \
            libcriterion-dev pkg-config

      - name: Verify installation
        run: |
          cmake --version
          ninja --version
          clang-19 --version
          clang-tidy-19 --version
          clang-format-19 --version
          pkg-config --modversion criterion
          ls -l /usr/bin/ld.lld* /usr/bin/lld*

      - name: Build
        run: ./build.sh

      - name: Verify build
        run: |
          ls -la builds/
          ls -la target/

      - name: Run Criterion unit tests
        run: |
          ctest --test-dir builds/build-debug --output-on-failure
          ./builds/build-debug/gustav_unit_tests --verbose

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Set up Python and Pytest
        run: |
          uv tool install pytest

      - name: Run tests
        run: pytest -vv

      - uses: actions/upload-artifact@v7
        with:
          name: gustav-build-targets
          path: ./target
          if-no-files-found: error